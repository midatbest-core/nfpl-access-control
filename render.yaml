services:
  - type: web
    name: nfpl-access-control-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn nfpl_access_control.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: NFPL_SQL_ECHO
        value: "false"

